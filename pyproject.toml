[build-system]
requires = ["setuptools>=75.0.0,<76.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alife"
version = "0.1.0"
description = "CPU reference artificial-life simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "msgspec>=0.21.1,<1.0.0",
    "numpy>=2.2.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.scripts]
run-simulation = "cli.run_simulation:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: configuration and runtime wiring checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
